name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the tokens, then fails if a token is missing, a reference is broken
      # or a colour pair drops below WCAG AA in light or dark.
      - run: pnpm --filter @rajaramasami/mds-tokens test
      - run: pnpm --filter @rajaramasami/mds-react typecheck
      - run: pnpm --filter @rajaramasami/mds-react test
      - run: pnpm build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: apps/storybook/storybook-static
